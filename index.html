<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/gym-os-frontend/brand/beyond-pixells-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0E27" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="manifest" href="/gym-os-frontend/manifest.json" />
    <link rel="apple-touch-icon" href="/gym-os-frontend/apple-touch-icon.png" />
    <title>GYM OS — by Beyond Pixels</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Kill any old service workers that are caching stale content
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var registration of registrations) {
            registration.unregister();
          }
          // After unregistering, register the fresh one
          navigator.serviceWorker.register("./sw.js").catch(function() {});
        });
      }
    </script>
  </body>
</html>
