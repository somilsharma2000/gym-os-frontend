<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GYM OS</title>
    <script>
      // SPA redirect for GitHub Pages
      var pathSegmentsToKeep = 1; // /gym-os-frontend/
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?' +
        (l.pathname ? '&p=' + l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/') : '') +
        (l.search ? '&s=' + l.search.slice(1) : '') +
        (l.hash ? '&h=' + l.hash.slice(1) : '')
      );
    </script>
  </head>
  <body></body>
</html>
